[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ammonitor"
version = "1.1.2"
description = "Integrated multi-modal in-situ monitoring for metal additive manufacturing, with a closed-form detectability bound"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Yudong Xu" }]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "matplotlib>=3.8",
  "PyWavelets>=1.5",
  "opencv-python>=4.8.0",
  "pydicom>=2.4",
  "pandas>=2.0",
  "scikit-learn>=1.4",
  "tifffile>=2023.7",
]

[project.optional-dependencies]
ml = ["scikit-learn>=1.4"]
dev = ["pytest>=7"]

[project.scripts]
ammonitor = "ammonitor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ammonitor*", "dbound*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
