name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest
      - name: tests
        run: pytest -q

  registry-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: registry matches CODE/
        run: |
          pip install -e . pytest
          python tools/scan_stages.py
          git diff --exit-code src/ammonitor/stages.json
      - name: cli
        run: |
          python -m ammonitor list
          python -m ammonitor report
